name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Versión estable para Buildozer

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            libsqlite3-dev \
            sqlite3 \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 wheel

      # 📦 Descargar y preparar el proyecto
      - name: Download and Unzip project
        run: |
          curl -L --fail -o spacebox.zip https://github.com/iannolavarria-svg/aaaaaaaaaa/releases/download/x/spacebox.zip
          unzip -o spacebox.zip
          rm spacebox.zip

      # 🔍 Localizar y mover archivos a la raíz (Para evitar errores de ruta)
      - name: Prepare Workspace
        run: |
          SPEC_FILE=$(find . -name buildozer.spec | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ ERROR: No se encontró buildozer.spec"
            exit 1
          fi
          SPEC_DIR=$(dirname "$SPEC_FILE")
          echo "Moviendo archivos desde $SPEC_DIR a la raíz..."
          mv "$SPEC_DIR"/* . || true
          ls -la

      # 🔨 Build APK (Usando el comando oficial para GitHub Actions)
      - name: Build with Buildozer
        run: |
          # Aceptamos licencias de Android automáticamente
          yes | buildozer -v android debug
        env:
          # Esto evita errores de permisos en el entorno de GitHub
          USER: runner

      # 📦 Subir APK generado
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
