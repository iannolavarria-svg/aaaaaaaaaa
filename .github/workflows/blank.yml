name: Build APK (Pygame Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libffi-dev libssl-dev zlib1g-dev libsqlite3-dev unzip zip ffmpeg

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel cython==0.29.36
          pip install buildozer==1.5.0

      - name: Download and extract project
        run: |
          echo "Descargando spacebox.zip..."
          curl -L --fail -o spacebox.zip \
            "https://github.com/iannolavarria-svg/aaaaaaaaaa/releases/download/x/spacebox.zip"

          echo "Descomprimiendo..."
          unzip -o spacebox.zip
          rm spacebox.zip

          # Mostrar estructura para debug
          echo "=== Estructura después de unzip ==="
          ls -la

      - name: Find and move buildozer.spec to root
        run: |
          echo "Buscando buildozer.spec..."
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo "❌ ERROR: No se encontró buildozer.spec en el zip"
            echo "Archivos encontrados:"
            find . -name "*.spec" -o -name "buildozer*" | head -20
            exit 1
          fi

          SPEC_DIR=$(dirname "$SPEC_FILE")
          echo "✅ buildozer.spec encontrado en: $SPEC_FILE"
          
          # Mover todo el contenido de la carpeta del spec a la raíz
          if [ "$SPEC_DIR" != "." ]; then
            echo "Moviendo archivos desde $SPEC_DIR a la raíz..."
            cp -rf "$SPEC_DIR"/* . || true
            rm -rf "$SPEC_DIR"
          fi

          # Verificar que ahora exista en la raíz
          if [ ! -f "buildozer.spec" ]; then
            echo "❌ ERROR: No se pudo mover buildozer.spec a la raíz"
            ls -la
            exit 1
          fi

          echo "✅ buildozer.spec listo en la raíz"

      - name: Check icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️  icon.png no encontrado, creando archivo vacío..."
            touch icon.png
          else
            echo "✅ icon.png encontrado"
          fi

      - name: Build APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g"
          yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
          retention-days: 7
