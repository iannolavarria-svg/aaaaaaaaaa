name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Forzamos JDK 17 explícitamente (Necesario para Android API 33)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libunwind-dev
          sudo apt install -y \
            build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev unzip zip libsqlite3-dev \
            sqlite3 libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good libffi-dev libssl-dev autoconf automake \
            libtool pkg-config cmake lld

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Download and Unzip project
        run: |
          curl -L --fail -o spacebox.zip "https://github.com/iannolavarria-svg/aaaaaaaaaa/releases/download/x/spacebox.zip"
          unzip -o spacebox.zip
          rm spacebox.zip

      - name: Prepare Workspace (Explicit Move)
        run: |
          SPEC_FILE=$(find . -name buildozer.spec | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ ERROR: No se encontró buildozer.spec"
            exit 1
          fi
          SPEC_DIR=$(dirname "$SPEC_FILE")
          # Mover todo a la raíz para que source.dir = . funcione siempre
          cp -r "$SPEC_DIR"/* . || true
          
          # Crear un icono de emergencia si no existe el PNG
          if [ ! -f "icon.png" ]; then
            echo "⚠️ icon.png no encontrado. Intentando usar icon.ico o creando uno vacío."
            cp icon.ico icon.png || touch icon.png
          fi

      - name: Build with Buildozer
        run: |
          # Aumentamos memoria de Gradle para evitar crashes al final
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g"
          # Comando explícito con log nivel 2
          yes | buildozer -v android debug
        env:
          USER: runner

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
