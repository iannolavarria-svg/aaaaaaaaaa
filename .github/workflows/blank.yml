name: Build APK (Pygame Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 libffi-dev libssl-dev \
            ffmpeg pkg-config cmake lld unzip zip

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel cython==0.29.36
          pip install buildozer==1.5.0

      - name: Prepare project files
        run: |
          # Buscar y mover buildozer.spec a la raíz
          SPEC_FILE=$(find . -name "buildozer.spec" | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ ERROR: No se encontró buildozer.spec"
            exit 1
          fi
          SPEC_DIR=$(dirname "$SPEC_FILE")
          cp -rf "$SPEC_DIR"/* . || true

          # Crear icon.png de emergencia si no existe
          if [ ! -f "icon.png" ]; then
            echo "⚠️  icon.png no encontrado, creando uno vacío..."
            touch icon.png
          fi

      - name: Build APK with Buildozer
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          yes | buildozer -v android debug
        env:
          USER: runner

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
          retention-days: 7

      - name: Show build summary
        if: always()
        run: |
          echo "=== Build finalizado ==="
          ls -la bin/ || echo "No se encontró la carpeta bin/"
